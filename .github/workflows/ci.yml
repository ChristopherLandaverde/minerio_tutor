name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref (e.g. rapid pushes / PR updates)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluent-mineiro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fluent-mineiro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type & Svelte check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
