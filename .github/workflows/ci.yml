name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref (e.g. rapid pushes / PR updates)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluent-mineiro
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fluent-mineiro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type & Svelte check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    # macOS matches the deploy target (Mac + future iOS) and ships webkit,
    # so no Linux system-dependency install is needed.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fluent-mineiro/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fluent-mineiro/src-tauri

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
